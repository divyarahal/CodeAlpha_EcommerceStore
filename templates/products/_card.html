<article class="card">
  <a href="{{ p.get_absolute_url }}" class="thumb">
    {% if p.image_url %}<img src="{{ p.image_url }}" alt="{{ p.name }}" loading="lazy">
    {% else %}<span class="ph" aria-hidden="true">{{ p.category.icon|default:"🛍️" }}</span>{% endif %}
  </a>
  <div class="card-body">
    <p class="muted small">{{ p.category.name }}</p>
    <h3><a href="{{ p.get_absolute_url }}">{{ p.name }}</a></h3>
    <p class="price">₹{{ p.price }}</p>
    {% if p.in_stock %}
      <form method="post" action="{% url 'cart:add' p.id %}">{% csrf_token %}
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="back" value="{{ request.get_full_path }}">
        <button type="submit" class="btn">Add to cart</button>
      </form>
    {% else %}<p class="out">Out of stock</p>{% endif %}
  </div>
</article>
